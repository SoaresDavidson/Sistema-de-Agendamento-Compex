[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.16.4",
    "fastapi>=0.141.1",
    "psycopg[binary]>=3.2.9",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.43",
    "uvicorn>=0.52.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.16.2",
]

[tool.ruff]
line-length = 88
[tool.ruff.format]
skip-magic-trailing-comma = false

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
markers = [
    "integration: testes que utilizam infraestrutura externa",
]
pythonpath = ["."]
testpaths = ["tests"]
