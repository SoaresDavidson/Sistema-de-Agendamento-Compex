<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Médicos · Clínica Aurora</title><link rel="stylesheet" href="styles.css"><script src="app.js" defer></script></head><body data-screen="doctor" data-title="Médicos" data-behavior="doctors">
<div class="page-content"><section class="page-head" data-od-id="medicos-cabecalho"><div><h1>Médicos</h1><p>Cada médico deve possuir ao menos uma especialidade antes de receber horários.</p></div><button class="btn btn-primary" data-open-modal="doctor-modal">Cadastrar médico</button></section><section class="toolbar" data-od-id="medicos-filtros"><div class="field search"><label for="doctor-search">Pesquisar médico</label><input class="input" id="doctor-search" placeholder="Nome do médico"></div><div class="field"><label for="doctor-specialty">Especialidade</label><select class="select" id="doctor-specialty"></select></div></section><section data-od-id="medicos-listagem"><div class="table-wrap"><table class="table" style="min-width:680px"><thead><tr><th>Médico</th><th>Especialidades</th><th style="text-align:right">Ações</th></tr></thead><tbody id="doctors-body"></tbody></table></div></section></div>
<div class="modal-backdrop" id="doctor-modal" role="dialog" aria-modal="true" aria-labelledby="doctor-title"><div class="modal"><div class="modal-head"><div><h2 id="doctor-title">Dados do médico</h2><p class="breadcrumb">Selecione uma ou mais especialidades.</p></div><button class="modal-close" data-close-modal="doctor-modal" aria-label="Fechar">×</button></div><div class="field"><label class="required" for="doctor-name">Nome completo</label><input class="input" id="doctor-name" value="Dra. Mariana Alves"></div><fieldset class="field" style="border:0;padding:0;margin:18px 0 0"><legend class="field-label">Especialidades</legend><div class="select-list"><label class="check-row"><input type="checkbox" checked><span>Cardiologia</span></label><label class="check-row"><input type="checkbox" checked><span>Clínica médica</span></label><label class="check-row"><input type="checkbox"><span>Dermatologia</span></label><label class="check-row"><input type="checkbox"><span>Endocrinologia</span></label><label class="check-row"><input type="checkbox"><span>Ginecologia</span></label><label class="check-row"><input type="checkbox"><span>Ortopedia</span></label></div></fieldset><div class="modal-actions"><button class="btn btn-secondary" data-close-modal="doctor-modal">Cancelar</button><button class="btn btn-primary" id="save-doctor">Salvar médico</button></div></div></div>
</body></html>
