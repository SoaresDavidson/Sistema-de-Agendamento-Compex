<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cadastrar cliente · Clínica Aurora</title><link rel="stylesheet" href="styles.css"><script src="app.js" defer></script></head><body data-screen="people" data-title="Cadastrar cliente" data-crumb="Clientes / Cadastro" data-behavior="clientForm">
<div class="page-content"><section class="page-head" data-od-id="cliente-form-cabecalho"><div><h1>Cadastrar cliente</h1><p>Nome, telefone e data de nascimento são obrigatórios. E-mail é opcional.</p></div><a class="btn btn-secondary" href="clientes.html">Voltar para clientes</a></section><section class="card" data-od-id="cliente-formulario" style="max-width:820px"><form id="client-form"><div class="form-grid"><div class="field span-2"><label class="required" for="client-name">Nome completo</label><input class="input" id="client-name" required placeholder="Ex.: Ana Paula Ribeiro" value="Ana Paula Ribeiro"></div><div class="field"><label class="required" for="client-phone">Telefone</label><input class="input" id="client-phone" required type="tel" placeholder="(85) 99999-9999" value="(85) 98841-2030"></div><div class="field"><label for="client-email">E-mail opcional</label><input class="input" id="client-email" type="email" placeholder="nome@email.com"></div><div class="field"><label class="required" for="client-birth">Data de nascimento</label><input class="input" id="client-birth" required type="date" max="2026-08-06" value="1987-03-12"></div></div><div class="notice" id="duplicate-alert" style="margin-top:20px"><div><strong>Possível cliente duplicado</strong><p>Já existe “Ana Paula Ribeiro” com nascimento em 12/03/1987. Compare os dados antes de continuar.</p><label class="check-row" style="margin-top:10px"><input type="checkbox" id="allow-duplicate"><span>Revisei os dados e quero cadastrar mesmo assim</span></label></div></div><div class="form-actions"><a class="btn btn-secondary" href="clientes.html">Cancelar</a><button class="btn btn-primary" type="submit">Salvar cliente</button></div></form></section></div>
</body></html>
